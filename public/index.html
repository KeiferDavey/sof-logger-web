<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoF Logger</title><link rel="stylesheet" href="/xterm.css"><style>body{background:#101418;color:#e5edf3;font:14px system-ui;margin:20px}header{display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:22px}button{background:#26343f;border:1px solid #495a68;border-radius:4px;color:#fff;padding:8px 14px;cursor:pointer}#terminal{padding:16px;background:#000;border:1px solid #394854;overflow:auto}nav{display:flex;gap:8px;align-items:center;margin:16px 0;flex-wrap:wrap}p{color:#b1c0ca}form{margin-left:auto}#status{color:#80cf61}</style><header><h1>SoF Logger</h1><span id="status">Connecting…</span><form method="post" action="/logout"><button>Sign out</button></form></header><nav><button data-key="\u001bOP">F1 / Console</button><button data-key="\u001b[A">↑</button><button data-key="\u001b[B">↓</button><button data-key="\u001b[D">←</button><button data-key="\u001b[C">→</button><button data-key="+">Access +</button><button data-key="-">Access −</button><button data-key="K" data-confirm="Kick the selected player?">Kick (K)</button><button data-key="B" data-confirm="Ban the selected player?">Ban (B)</button><button data-key="Q" data-confirm="Quit the logger? Restart it through Pterodactyl afterwards.">Quit (Q)</button></nav><div id="terminal"></div><p>Click the terminal to use the original keyboard controls. F1 or ~ switches console mode. Enter commands without “rcon”. All signed-in browsers share this logger and selection. Button keys are sent to the active mode, just like typing.</p><script src="/xterm.js"></script><script src="/app.js"></script></html>
